name: Hub veröffentlichen (GitHub Pages)

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Daten prüfen
        run: node -e "JSON.parse(require('fs').readFileSync('data/labs.json','utf8')); JSON.parse(require('fs').readFileSync('data/config.json','utf8')); console.log('Daten ok')"
      - name: Blog-Index erzeugen
        run: node .github/scripts/blog-index.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
